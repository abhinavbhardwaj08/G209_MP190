# MP190 findings --- fill in every value, keep every key.
# The marking tool reads this file. Write null only where the comment says so.
# Use the exact column names and group values from your data files.

group_id: "G209"          # your group id, e.g. "G042"
problem_id: "MP190"

data_issues:
  # For each of the 7 kinds: present: true or false.
  # If present is false, leave the other values as null.
  leaking_column:
    present: true
    column: "pm25_measured_next_day"           # the column that must not be used as a feature
  unit_mixup:
    present: true
    column: "wind_kmph"           # the column recorded in a different unit
    group_value: "Residential"      # the value of station_zone whose rows are affected
    factor: 1000           # wrong value = right value x factor
  sentinel_value:
    present: false
    column: null
    value: null            # the special number typed instead of a blank
    count: null            # how many rows have it
  duplicate_rows:
    present: true
    count: 39            # number of EXTRA copies (rows you would delete)
  stuck_sensor:
    present: false
    column: null
    start_date: null       # first date with the stuck value, YYYY-MM-DD
    end_date: null         # last date with the stuck value, YYYY-MM-DD
  target_typos:
    present: true
    count: 8            # rows whose target was typed 10 times too big
  spelling_variants:
    present: false
    column: null
    true_levels: null      # how many real categories there are after cleaning

tracking:
  experiment_name: "mp190_kochi_air_quality"
  best_run_id: "0860ccaf61b24086b3bc25e45401cb88"        # the MLflow run id of your v1 model
  registered_model_name: "mp190-pm25-predictor"
  champion_version: 3

monitoring:
  psi:                     # cleaned train.csv vs later.csv, 10 bins
    pm25_today: 0.035301
    wind_kmph: 0.027169
    humidity_pct: 0.038531
    temp_c: 3.608686
    traffic_index: 0.03763
    stubble_fires: 0.013382
  most_drifted_feature: temp_c
  mae_by_group:            # v1 on later.csv, per value of station_zone
    'Central': 52.908134
    'Residential': 36.361118
    'Industrial': 30.975156
  worst_served_group: Central
  mae_v1_on_check: 44.48543452380954    # v1 on the last 30% of later.csv (by date)
  mae_v2_on_check: 25.82497777717653    # v2 on the same rows
  decision: promote           # promote or keep
