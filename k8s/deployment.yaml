apiVersion: apps/v1
kind: Deployment
metadata:
  name: mp190-api
  labels:
    app: mp190-api
    group: G209
    problem: MP190
spec:
  replicas: 4
  selector:
    matchLabels:
      app: mp190-api
  template:
    metadata:
      labels:
        app: mp190-api
    spec:
      containers:
        - name: mp190-api
          image: mp190-api:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
